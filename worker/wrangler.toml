name = "andes-autoparts-ml-sync"
main = "worker.js"
compatibility_date = "2024-11-01"

# Variables públicas (no sensibles)
[vars]
ML_CLIENT_ID = "2004412570250603"
ML_REDIRECT_URI = "https://andesautoparts.cl/admin/renovar-token.html"
GITHUB_OWNER = "andesautopartscl-sketch"
GITHUB_REPO = "WebAndesAutoParts"
GITHUB_BRANCH = "main"
GITHUB_FILE_PATH = "data/productos.json"
# Pedidos: PEDIDOS_FROM debe usar el dominio verificado en Resend.
PEDIDOS_FROM = "Andes Auto Parts <pedidos@andesautoparts.cl>"
PEDIDOS_AVISO = "andesautopartscl@gmail.com"

# KV para ML_ACCESS_TOKEN (permite POST /update-token en runtime)
# Tras crear el namespace, reemplaza id y preview_id:
#   npx wrangler kv namespace create TOKEN_KV
#   npx wrangler kv namespace create TOKEN_KV --preview
[[kv_namespaces]]
binding = "TOKEN_KV"
id = "36d3f5ea6b074512a4906890f596b3ac"
preview_id = "0c60c3b6712f4df6b699e3f15fd2bcdf"

# Base aislada de clientes, carritos y descuentos (worker/schema-clientes.sql)
[[d1_databases]]
binding = "CLIENTES_DB"
database_name = "andes-clientes"
database_id = "b8e48160-8257-474b-aabf-b335b32e3915"

# Secrets (configurar con wrangler secret put o renew-token.sh):
#   ML_ACCESS_TOKEN      — token OAuth de Mercado Libre
#   ML_CLIENT_SECRET     — secreto de la app ML
#   GITHUB_TOKEN         — Personal Access Token (repo contents: write)
#   WORKER_SYNC_SECRET   — clave para proteger /sync, /update-token y /orders/lista
#   RESEND_API_KEY       — clave de Resend para enviar los correos de pedidos
#   TURNSTILE_SECRET_KEY  — secreto de Cloudflare Turnstile (login / registro)
#   ADMIN_BOOTSTRAP_EMAIL — correo del primer admin (alta única vía /auth/bootstrap)
#   ADMIN_BOOTSTRAP_PASSWORD — clave del primer admin
