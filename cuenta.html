<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi cuenta | Andes Auto Parts</title>
  <meta name="description" content="Inicia sesión o crea tu cuenta en Andes Auto Parts." />
  <link rel="icon" href="logo_andes.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260909n" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="Andes Auto Parts — Inicio">
        <span class="logo-surface">
          <img src="logo_andes.png" alt="Andes Auto Parts" class="logo-img" width="200" height="48" />
        </span>
      </a>
      <nav class="site-nav" id="site-nav">
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#productos">Catálogo</a></li>
          <li><a href="checkout.html">Carrito</a></li>
        </ul>
        <div class="header-actions">
          <span data-auth-slot></span>
        </div>
      </nav>
    </div>
  </header>

  <main class="account">
    <div class="container account__wrap">
      <section class="account-panel" id="panel-auth">
        <h1 class="account-panel__title">Mi cuenta</h1>
        <p class="account-panel__lead">
          Guarda tus datos para el próximo pedido. Si agregaste productos sin sesión,
          se suman a tu carrito al entrar.
        </p>

        <div class="account-tabs" role="tablist">
          <button type="button" class="account-tab is-active" data-tab="login">Entrar</button>
          <button type="button" class="account-tab" data-tab="registro">Crear cuenta</button>
        </div>

        <form class="account-form" id="form-login" autocomplete="on">
          <div class="field">
            <label for="login-email">Correo</label>
            <input type="email" id="login-email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="login-clave">Clave</label>
            <input type="password" id="login-clave" name="clave" required minlength="8" autocomplete="current-password" />
          </div>
          <p class="account-error" id="login-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
        </form>

        <form class="account-form" id="form-registro" hidden autocomplete="on">
          <div class="field">
            <label for="reg-nombre">Nombre y apellido</label>
            <input type="text" id="reg-nombre" name="nombre" required minlength="2" autocomplete="name" />
          </div>
          <div class="field">
            <label for="reg-email">Correo</label>
            <input type="email" id="reg-email" name="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="reg-telefono">Teléfono</label>
            <input type="tel" id="reg-telefono" name="telefono" autocomplete="tel" placeholder="+56 9 …" />
          </div>
          <div class="field">
            <label for="reg-clave">Clave (mín. 8 caracteres)</label>
            <input type="password" id="reg-clave" name="clave" required minlength="8" autocomplete="new-password" />
          </div>
          <p class="account-error" id="reg-error" hidden></p>
          <button type="submit" class="btn btn-primary btn-lg">Crear cuenta</button>
        </form>
      </section>

      <section class="account-panel" id="panel-perfil" hidden>
        <h1 class="account-panel__title">Hola, <span id="perfil-saludo">—</span></h1>
        <p class="account-panel__lead" id="perfil-descuento"></p>

        <form class="account-form" id="form-perfil">
          <div class="checkout-fields">
            <div class="field">
              <label for="perfil-nombre">Nombre</label>
              <input type="text" id="perfil-nombre" name="nombre" required />
            </div>
            <div class="field">
              <label for="perfil-email">Correo</label>
              <input type="email" id="perfil-email" disabled />
            </div>
            <div class="field">
              <label for="perfil-telefono">Teléfono</label>
              <input type="tel" id="perfil-telefono" name="telefono" />
            </div>
            <div class="field">
              <label for="perfil-rut">RUT</label>
              <input type="text" id="perfil-rut" name="rut" placeholder="12345678-5" />
            </div>
            <div class="field field--wide">
              <label for="perfil-direccion">Dirección</label>
              <input type="text" id="perfil-direccion" name="direccion" />
            </div>
            <div class="field">
              <label for="perfil-comuna">Comuna</label>
              <input type="text" id="perfil-comuna" name="comuna" />
            </div>
            <div class="field">
              <label for="perfil-region">Región</label>
              <input type="text" id="perfil-region" name="region" />
            </div>
          </div>
          <p class="account-error" id="perfil-error" hidden></p>
          <p class="account-ok" id="perfil-ok" hidden>Datos guardados.</p>
          <div class="account-actions">
            <button type="submit" class="btn btn-primary">Guardar datos</button>
            <a class="btn btn-outline" href="checkout.html">Ir al checkout</a>
            <button type="button" class="btn btn-outline" id="btn-logout">Cerrar sesión</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="contact-config.js?v=20260909m"></script>
  <script src="cart.js?v=20260909n"></script>
  <script src="auth.js?v=20260909n"></script>
  <script>
    (function () {
      var formLogin = document.getElementById("form-login");
      var formReg = document.getElementById("form-registro");
      var formPerfil = document.getElementById("form-perfil");
      var panelAuth = document.getElementById("panel-auth");
      var panelPerfil = document.getElementById("panel-perfil");

      function mostrarError(el, msg) {
        el.hidden = !msg;
        el.textContent = msg || "";
      }

      function pintarPerfil(u) {
        if (!u) {
          panelAuth.hidden = false;
          panelPerfil.hidden = true;
          return;
        }
        panelAuth.hidden = true;
        panelPerfil.hidden = false;
        document.getElementById("perfil-saludo").textContent = (u.nombre || "").split(" ")[0] || "cliente";
        var desc = document.getElementById("perfil-descuento");
        desc.textContent =
          Number(u.descuento_pct) > 0
            ? "Tu descuento de cuenta es " + u.descuento_pct + "% sobre el precio de lista (salvo precios especiales)."
            : "Aún no tienes un descuento porcentual asignado. Si eres cliente frecuente, pídeselo a tu vendedor.";
        formPerfil.nombre.value = u.nombre || "";
        document.getElementById("perfil-email").value = u.email || "";
        formPerfil.telefono.value = u.telefono || "";
        formPerfil.rut.value = u.rut || "";
        formPerfil.direccion.value = u.direccion || "";
        formPerfil.comuna.value = u.comuna || "";
        formPerfil.region.value = u.region || "";
      }

      document.querySelectorAll("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("[data-tab]").forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
          });
          var tab = btn.getAttribute("data-tab");
          formLogin.hidden = tab !== "login";
          formReg.hidden = tab !== "registro";
        });
      });

      formLogin.addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("login-error");
        mostrarError(err, "");
        window.AndesAuth.login({
          email: formLogin.email.value,
          clave: formLogin.clave.value,
        }).then(function (data) {
          if (!data.ok) {
            mostrarError(err, data.message || "No pudimos iniciar sesión.");
            return;
          }
          pintarPerfil(data.usuario);
        }).catch(function () {
          mostrarError(err, "Error de red. Intenta de nuevo.");
        });
      });

      formReg.addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("reg-error");
        mostrarError(err, "");
        window.AndesAuth.registrar({
          nombre: formReg.nombre.value,
          email: formReg.email.value,
          telefono: formReg.telefono.value,
          clave: formReg.clave.value,
        }).then(function (data) {
          if (!data.ok) {
            mostrarError(err, data.message || "No pudimos crear la cuenta.");
            return;
          }
          pintarPerfil(data.usuario);
        }).catch(function () {
          mostrarError(err, "Error de red. Intenta de nuevo.");
        });
      });

      formPerfil.addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("perfil-error");
        var ok = document.getElementById("perfil-ok");
        mostrarError(err, "");
        ok.hidden = true;
        window.AndesAuth.actualizarYo({
          nombre: formPerfil.nombre.value,
          telefono: formPerfil.telefono.value,
          rut: formPerfil.rut.value,
          direccion: formPerfil.direccion.value,
          comuna: formPerfil.comuna.value,
          region: formPerfil.region.value,
        }).then(function (data) {
          if (!data.ok) {
            mostrarError(err, data.message || "No se pudo guardar.");
            return;
          }
          ok.hidden = false;
          pintarPerfil(data.usuario);
        });
      });

      document.getElementById("btn-logout").addEventListener("click", function () {
        window.AndesAuth.logout().then(function () {
          pintarPerfil(null);
        });
      });

      pintarPerfil(window.AndesAuth.usuario());
    })();
  </script>
</body>
</html>
